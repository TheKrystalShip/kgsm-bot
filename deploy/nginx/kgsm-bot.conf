# The Discord bot's member-to-member wire, and the only thing it listens on. Installed into
# /etc/nginx/conf.d/ by deploy/setup.sh.
#
# It serves no browser surface at all — this name exists so the other members of the cluster have an
# address to reach it at. A member is pushed to rather than polling: the auth anchor fans each account
# change into every member's inbox, and a member with no advertisable address holds whatever it copied
# when it joined and never hears that somebody was demoted.
#
# Loopback upstream, TLS terminated here: the same shape every member on this machine takes. The name
# the cluster's DNS anchor gives the chat capability is served beside this one, from the site the bot
# generates, through the same proxy rules.

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name bot.thekrystalship.com;

    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    include /etc/nginx/kgsm/kgsm-bot.locations;
}
