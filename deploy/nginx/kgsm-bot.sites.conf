# kgsm-bot — the site the bot generates for the names its cluster's DNS anchor gave it.
#
# The bot writes /var/lib/kgsm/nginx/kgsm-bot.conf from a fixed template: a name, its certificate, and
# this component's proxy rules from /etc/nginx/kgsm/kgsm-bot.locations. A name appears there only once
# its certificate exists. The pattern matches that one file and nothing else, and matching nothing is
# not an error, so the web server loads cleanly before the bot has written anything.
include /var/lib/kgsm/nginx/kgsm-bot*.conf;
